name: Forced alignment
on:
  push:
    branches: ['align-*']
    paths: ['tools/align/transcript.txt']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q uroman soundfile
      - run: python tools/align/align.py tools/align/vo16.wav tools/align/transcript.txt tools/align/aligned.json
      - run: |
          git config user.name align-bot && git config user.email align-bot@users.noreply.github.com
          git add tools/align/aligned.json && git commit -q -m "aligned [skip ci]" && git push -q origin HEAD
