name: Render episode

# Renders an episode when its script changes (or on demand), then publishes the MP4 as a GitHub release asset.
on:
  push:
    branches: [main]
    paths: ['episodes/*/script.json']
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode folder name (e.g. spain)'
        required: true

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - name: Pick episode
        id: ep
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then EP="${{ github.event.inputs.episode }}";
          else EP=$(git diff --name-only HEAD~1 HEAD | grep -E '^episodes/[^/]+/script.json$' | head -1 | cut -d/ -f2); fi
          test -n "$EP" && test -f "episodes/$EP/script.json"
          echo "id=$EP" >> "$GITHUB_OUTPUT"; echo "Episode: $EP"

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin ffmpeg > /dev/null

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          pip install -q -r pipeline/requirements.txt

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: models-v1

      - name: Download Kokoro voice model
        run: |
          mkdir -p models/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro/kokoro-v1.0.int8.onnx ] || curl -sSL -o models/kokoro/kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx
          [ -f models/kokoro/voices-v1.0.bin ] || curl -sSL -o models/kokoro/voices-v1.0.bin $B/voices-v1.0.bin

      - name: Narration (TTS + word timing)
        env: { KOKORO_DIR: models/kokoro, WHISPER_MODEL: small.en }
        run: python pipeline/voice.py episodes/${{ steps.ep.outputs.id }} 2>&1 | tee -a build.log

      - name: Prepare data + audio mix
        run: |
          python pipeline/prepare.py episodes/${{ steps.ep.outputs.id }} 2>&1 | tee -a build.log
          python pipeline/mix.py episodes/${{ steps.ep.outputs.id }} 2>&1 | tee -a build.log
          B=episodes/${{ steps.ep.outputs.id }}/build
          ffmpeg -y -loglevel error -i $B/mix_raw.wav -af "loudnorm=I=-14:TP=-1.2:LRA=9" -ar 48000 $B/mix.wav

      - name: Render video (Remotion)
        run: |
          npx remotion render src/index.ts Episode build/video.mp4 --gl=swangle --concurrency=4 --codec=h264 --crf=18 \
            --image-format=jpeg --jpeg-quality=92 --log=error 2>&1 | tee -a build.log

      - name: Render thumbnail
        run: npx remotion still src/index.ts Thumbnail build/thumb.jpg --gl=swangle --image-format=jpeg --jpeg-quality=92 --log=error 2>&1 | tee -a build.log

      - name: Mux and compress for upload (<= 290 MB)
        id: out
        run: |
          ID=${{ steps.ep.outputs.id }}; mkdir -p out
          ffmpeg -y -loglevel error -i build/video.mp4 -i episodes/$ID/build/mix.wav -map 0:v -map 1:a -c:v libx264 -preset medium -crf 20 \
            -maxrate 7M -bufsize 14M -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 256k -shortest out/$ID.mp4
          ls -la out
          echo "file=out/$ID.mp4" >> "$GITHUB_OUTPUT"

      - name: Cut the vertical Short
        run: |
          ID=${{ steps.ep.outputs.id }}
          npx remotion still src/index.ts ShortFrame build/short_frame.png --gl=swangle --image-format=png --log=error 2>&1 | tee -a build.log
          python3 pipeline/short.py out/$ID.mp4 build/short_frame.png out/$ID-short.mp4 2>&1 | tee -a build.log

      - name: Publish release asset
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          ID=${{ steps.ep.outputs.id }}
          gh release view ep-$ID >/dev/null 2>&1 || gh release create ep-$ID --title "Episode: $ID" --notes "Rendered by GitHub Actions."
          cp build/thumb.jpg out/$ID-thumb.jpg
          gh release upload ep-$ID out/$ID.mp4 out/$ID-thumb.jpg $( [ -f out/$ID-short.mp4 ] && echo out/$ID-short.mp4 ) --clobber

      - name: Write status back to the repo
        if: always()
        run: |
          ID=${{ steps.ep.outputs.id }}
          [ -n "$ID" ] || exit 0
          STATUS=${{ job.status }}
          SIZE=$( [ -f out/$ID.mp4 ] && stat -c%s out/$ID.mp4 || echo 0 )
          URL="https://github.com/${{ github.repository }}/releases/download/ep-$ID/$ID.mp4"
          python3 - "$ID" "$STATUS" "$SIZE" "$URL" <<'PY'
          import json, sys, os
          ep, status, size, url = sys.argv[1:5]
          log = open('build.log').read().splitlines()[-80:] if os.path.exists('build.log') else []
          chapters = []
          if os.path.exists('src/data/episode.json'):
              d = json.load(open('src/data/episode.json'))
              chapters = ['0:00 Intro'] + ['%d:%02d %s' % (int(max(0, s['start'] - 0.4)) // 60, int(max(0, s['start'] - 0.4)) % 60, s['scene']['chapter'])
                                           for s in d['segments'] if s['scene'].get('chapter')]
              if d['segments'][-1]['scene']['type'] == 'outro':
                  o = int(d['segments'][-1]['start']); chapters.append('%d:%02d Outro' % (o // 60, o % 60))
          json.dump({'episode': ep, 'status': status, 'size_bytes': int(size), 'video_url': url if int(size) else None, 'thumbnail_url': url.replace('.mp4', '-thumb.jpg') if int(size) else None, 'short_url': url.replace('.mp4', '-short.mp4') if os.path.exists(f'out/{ep}-short.mp4') else None,
                     'run': '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}', 'chapters': chapters, 'log_tail': log},
                    open(f'episodes/{ep}/status.json', 'w'), indent=1)
          PY
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add episodes/$ID/status.json && git commit -m "status: $ID $STATUS [skip ci]" && git pull --rebase -q && git push || true
